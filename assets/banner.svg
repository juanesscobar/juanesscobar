<svg width="1280" height="440" viewBox="0 0 1280 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Juan Escobar — Software Developer &amp; Applied AI Developer. Terminal: planificar, construir, automatizar, escalar.">
  <!-- Fondo -->
  <rect x="0" y="0" width="1280" height="440" rx="20" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- Glow suave -->
  <circle cx="180" cy="90" r="340" fill="#00D084" opacity="0.05"/>
  <circle cx="1080" cy="380" r="300" fill="#2F81F7" opacity="0.04"/>

  <!-- Panel izquierdo: presentación -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="72" y="118" font-size="15" font-weight="600" letter-spacing="7" fill="#8B949E">HOLA, SOY</text>
    <text x="70" y="188" font-size="58" font-weight="700" fill="#E6EDF3">Juan Escobar</text>
    <rect x="72" y="208" width="112" height="5" rx="2.5" fill="#00D084"/>
    <text x="72" y="252" font-size="23" font-weight="600" fill="#00D084">Software Developer · Applied AI Developer</text>
    <text x="72" y="298" font-size="17.5" fill="#8B949E">Construyo software, automatización y sistemas con IA</text>
    <text x="72" y="324" font-size="17.5" fill="#8B949E">para resolver problemas reales.</text>
    <text x="1208" y="414" text-anchor="end" font-size="14" fill="#484F58">Asunción, Paraguay</text>
  </g>

  <!-- Panel derecho: terminal -->
  <g font-family="'SF Mono',Consolas,'Liberation Mono',Menlo,monospace">
    <rect x="660" y="72" width="548" height="296" rx="10" fill="#010409" stroke="#30363D" stroke-width="1"/>

    <!-- Barra de título -->
    <circle cx="688" cy="104" r="6" fill="#FF5F56"/>
    <circle cx="712" cy="104" r="6" fill="#FFBD2E"/>
    <circle cx="736" cy="104" r="6" fill="#27C93F"/>
    <text x="1192" y="109" text-anchor="end" font-size="13" fill="#8B949E">conciencia — control plane</text>
    <line x1="660" y1="126" x2="1208" y2="126" stroke="#21262D" stroke-width="1"/>

    <!-- Comandos -->
    <text x="690" y="164" font-size="18" fill="#00D084">&gt;</text>
    <text x="708" y="164" font-size="18" fill="#E6EDF3">planificar()</text>

    <text x="690" y="198" font-size="18" fill="#00D084">&gt;</text>
    <text x="708" y="198" font-size="18" fill="#E6EDF3">construir()</text>

    <text x="690" y="232" font-size="18" fill="#00D084">&gt;</text>
    <text x="708" y="232" font-size="18" fill="#E6EDF3">automatizar()</text>

    <text x="690" y="266" font-size="18" fill="#00D084">&gt;</text>
    <text x="708" y="266" font-size="18" fill="#E6EDF3">escalar()</text>

    <!-- Asignaciones -->
    <text x="690" y="302" font-size="18" fill="#00D084">&gt;</text>
    <text x="708" y="302" font-size="18" fill="#79C0FF">impacto_real</text>
    <text x="838" y="302" font-size="18" fill="#8B949E">=</text>
    <text x="871" y="302" font-size="18" fill="#FF7B72">True</text>

    <text x="690" y="338" font-size="18" fill="#00D084">&gt;</text>
    <text x="708" y="338" font-size="18" fill="#79C0FF">conciencia</text>
    <text x="817" y="338" font-size="18" fill="#8B949E">=</text>
    <text x="850" y="338" font-size="18" fill="#7EE787">plataforma</text>

    <!-- Cursor -->
    <rect x="962" y="323" width="9" height="19" rx="1.5" fill="#00D084"/>
  </g>
</svg>
